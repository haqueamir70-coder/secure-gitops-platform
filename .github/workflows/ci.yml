name: Secure GitOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Tests, security scan and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Run tests
        run: pytest -q

      - name: Build container image
        run: docker build -t secure-gitops-platform:${{ github.sha }} .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secure-gitops-platform:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: secure-gitops-platform:${{ github.sha }}
          format: cyclonedx-json
          output-file: secure-gitops-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: secure-gitops-sbom
          path: secure-gitops-sbom.cdx.json
          if-no-files-found: error
