apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-gitops-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secure-gitops-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
